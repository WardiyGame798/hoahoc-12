<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Hóa Học 12</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 16px;
        }
        .question-meta {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #f1f5f9;
            border: 2px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:focus {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }
        .option-btn.correct {
            background: #bbf7d0 !important;
            border-color: var(--success-color) !important;
            color: #166534;
        }
        .option-btn.incorrect {
            background: #fecaca !important;
            border-color: var(--error-color) !important;
            color: #991b1b;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            outline: 3px solid var(--primary-color);
        }
        .explanation {
            margin-top: 16px;
            padding: 12px;
            background: #eff6ff;
            border-left: 4px solid var(--primary-color);
            font-size: 0.95rem;
            display: none;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        .btn:focus {
            outline: 3px solid #1e40af;
            outline-offset: 2px;
        }
        .btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            font-size: 1.1rem;
            color: #64748b;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ôn Thi Hóa Học 12</h1>
        <div id="app" class="loading" aria-live="polite">Đang tải dữ liệu từ kho câu hỏi...</div>
    </div>

    <script>
        // Link Google Sheet dạng CSV đã được tích hợp tự động
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1OCSLmh8D8Jinao0NytstbeNUKDjx0T6vh1K7Hrl0HHc/export?format=csv';

        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};

        async function loadData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                questions = parseCSV(data);
                
                // Lọc bỏ hàng tiêu đề nếu có
                if (questions.length > 0 && questions[0].ID === "ID") {
                    questions.shift();
                }

                if (questions.length > 0) {
                    renderQuestion();
                } else {
                    document.getElementById('app').innerHTML = '<div class="card" role="alert">Chưa có câu hỏi nào trong Google Sheet! Hãy thêm câu hỏi vào bảng đi "bro".</div>';
                }
            } catch (error) {
                document.getElementById('app').innerHTML = '<div class="card" role="alert">Lỗi tải dữ liệu từ Google Sheet. Hãy kiểm tra lại quyền chia sẻ đường liên kết!</div>';
            }
        }

        function parseCSV(text) {
            let lines = text.split('\n');
            let result = [];
            let headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                let currentline = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                let obj = {};
                for (let j = 0; j < headers.length; j++) {
                    let val = currentline[j] ? currentline[j].trim() : '';
                    if (val.startsWith('"') && val.endsWith('"')) {
                        val = val.substring(1, val.length - 1);
                    }
                    obj[headers[j]] = val;
                }
                result.push(obj);
            }
            return result;
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            const app = document.getElementById('app');
            
            let optionsHTML = '';
            
            if (q.Dang === 'MCQ' || q.Dang === 'TF') {
                const options = [
                    { key: 'A', text: q.DapAnA },
                    { key: 'B', text: q.DapAnB },
                    { key: 'C', text: q.DapAnC },
                    { key: 'D', text: q.DapAnD }
                ];
                
                optionsHTML = `<div class="options-list" role="radiogroup" aria-label="Các lựa chọn đáp án">` + options.map(opt => {
                    if (!opt.text) return ''; // Bỏ qua nếu đáp án trống
                    const isSelected = userAnswers[currentIndex] === opt.key;
                    return `
                        <button class="option-btn" role="radio" aria-checked="${isSelected}" 
                            aria-label="Đáp án ${opt.key}: ${opt.text}" 
                            onclick="selectAnswer('${opt.key}')">
                            <b>${opt.key}.</b> ${opt.text}
                        </button>
                    `;
                }).join('') + `</div>`;
            } else if (q.Dang === 'SHORT') {
                const currentVal = userAnswers[currentIndex] || '';
                optionsHTML = `
                    <div class="options-list">
                        <label for="short-answer" style="font-weight:600; font-size:0.9rem; margin-bottom:4px;">Nhập câu trả lời của bạn:</label>
                        <input type="text" id="short-answer" aria-label="Ô nhập câu trả lời ngắn" value="${currentVal}" oninput="selectAnswer(this.value)">
                    </div>
                `;
            }

            const isAnswered = userAnswers[currentIndex] !== undefined;
            let explanationStyle = isAnswered ? 'display: block;' : 'display: none;';
            
            app.innerHTML = `
                <div class="card" role="region" aria-label="Nội dung câu hỏi">
                    <div class="question-meta" aria-live="polite">Câu ${currentIndex + 1} trên tổng số ${questions.length}. Chủ đề: ${q.ChuDe || 'Chung'}. Dạng: ${q.Dang}</div>
                    <div class="question-title">${q.CauHoi}</div>
                    ${optionsHTML}
                    <div id="explanation-box" class="explanation" aria-live="polite" style="${explanationStyle}">
                        <b>Giải thích chi tiết:</b> ${q.GiaiThich || 'Không có giải thích.'}
                    </div>
                </div>
                <div class="nav-buttons">
                    <button class="btn" ${currentIndex === 0 ? 'disabled' : ''} aria-label="Chuyển về câu trước" onclick="prevQuestion()">Câu trước</button>
                    <button class="btn" ${currentIndex === questions.length - 1 ? 'disabled' : ''} aria-label="Chuyển sang câu sau" onclick="nextQuestion()">Câu sau</button>
                </div>
            `;

            if (isAnswered && (q.Dang === 'MCQ' || q.Dang === 'TF')) {
                highlightAnswers();
            }
        }

        function selectAnswer(val) {
            userAnswers[currentIndex] = val;
            const q = questions[currentIndex];
            
            if (q.Dang === 'MCQ' || q.Dang === 'TF') {
                const buttons = document.querySelectorAll('.option-btn');
                buttons.forEach(btn => {
                    const optKey = btn.querySelector('b').innerText.replace('.', '');
                    if (optKey === val) {
                        btn.setAttribute('aria-checked', 'true');
                    } else {
                        btn.setAttribute('aria-checked', 'false');
                    }
                });
                highlightAnswers();
            }
            
            document.getElementById('explanation-box').style.display = 'block';
        }

        function highlightAnswers() {
            const q = questions[currentIndex];
            const chosen = userAnswers[currentIndex];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach(btn => {
                const optKey = btn.querySelector('b').innerText.replace('.', '');
                if (optKey === q.DapAnDung) {
                    btn.classList.add('correct');
                    btn.setAttribute('aria-label', btn.getAttribute('aria-label') + ', Đáp án đúng');
                } else if (optKey === chosen && chosen !== q.DapAnDung) {
                    btn.classList.add('incorrect');
                    btn.setAttribute('aria-label', btn.getAttribute('aria-label') + ', Lựa chọn sai');
                }
            });
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        loadData();
    </script>
</body>
</html>
